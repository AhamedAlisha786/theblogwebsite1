name: Blog Website CI/CD

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build, Push and Clean ECR Images
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Frontend Docker Image
      - name: Build Frontend Docker Image
        env:
          ECR_REGISTRY: 742851378481.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: repo/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG" \
            ./clear-slate-blog

      # 5. Push Frontend Image
      - name: Push Frontend Image
        env:
          ECR_REGISTRY: 742851378481.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: repo/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG"

      # 6. Build Backend Docker Image
      - name: Build Backend Docker Image
        env:
          ECR_REGISTRY: 742851378481.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: repo/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG" \
            ./Blog_website

      # 7. Push Backend Image
      - name: Push Backend Image
        env:
          ECR_REGISTRY: 742851378481.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: repo/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG"

      # 8. Verify Local Docker Images
      - name: Verify Docker Images
        run: docker images

      # 9. Delete Previous Frontend Images from ECR
      - name: Delete Old Frontend Images from ECR
        env:
          AWS_REGION: ap-south-1
          ECR_REGISTRY_ID: "742851378481"
          ECR_REPOSITORY: repo/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          OLD_IMAGES=$(aws ecr list-images \
            --registry-id "$ECR_REGISTRY_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query "imageIds[?imageTag!=null && starts_with(imageTag, 'frontend-') && imageTag!='frontend-$IMAGE_TAG']" \
            --output json)

          echo "Previous frontend images:"
          echo "$OLD_IMAGES"

          echo "$OLD_IMAGES" | jq -c '.[]' |
          while read -r image; do
            TAG=$(echo "$image" | jq -r '.imageTag')

            echo "Deleting old frontend image: $TAG"

            aws ecr batch-delete-image \
              --registry-id "$ECR_REGISTRY_ID" \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-ids imageTag="$TAG"
          done

      # 10. Delete Previous Backend Images from ECR
      - name: Delete Old Backend Images from ECR
        env:
          AWS_REGION: ap-south-1
          ECR_REGISTRY_ID: "742851378481"
          ECR_REPOSITORY: repo/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          OLD_IMAGES=$(aws ecr list-images \
            --registry-id "$ECR_REGISTRY_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query "imageIds[?imageTag!=null && starts_with(imageTag, 'backend-') && imageTag!='backend-$IMAGE_TAG']" \
            --output json)

          echo "Previous backend images:"
          echo "$OLD_IMAGES"

          echo "$OLD_IMAGES" | jq -c '.[]' |
          while read -r image; do
            TAG=$(echo "$image" | jq -r '.imageTag')

            echo "Deleting old backend image: $TAG"

            aws ecr batch-delete-image \
              --registry-id "$ECR_REGISTRY_ID" \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-ids imageTag="$TAG"
          done

      # 11. Verify Remaining ECR Images
      - name: Verify ECR Images
        env:
          AWS_REGION: ap-south-1
          ECR_REGISTRY_ID: "742851378481"
          ECR_REPOSITORY: repo/blog
        run: |
          aws ecr list-images \
            --registry-id "$ECR_REGISTRY_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --output table
